[package]
name = "miux"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
linked_list_allocator = "0.10"
smoltcp = { version = "0.12", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "socket-dhcpv4", "socket-dns", "socket-icmp"] }
embedded-tls = { version = "0.19", default-features = false }
embedded-io = { version = "0.7", default-features = false }
rand_core = { version = "0.6", default-features = false }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
zune-png = { version = "0.4", default-features = false }
zune-jpeg = { version = "0.4", default-features = false }
zune-core = { version = "0.4", default-features = false }

[profile.dev]
panic = "abort"
opt-level = 1
debug = true

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1

[profile.release.package."*"]
opt-level = 3

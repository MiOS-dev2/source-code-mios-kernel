# KACTOMIB3AUMB GRUB Configuration
set timeout=15
set timeout_style=menu
set default=0

# Load video modules for VBE
insmod all_video
insmod vbe
insmod vga
insmod gfxterm
insmod gfxterm_background
insmod gfxterm_menu
insmod png
insmod jpeg
insmod font
insmod multiboot2
insmod module2

# Load font and set VBE mode
if loadfont /boot/grub/fonts/unicode.pf2; then
    set gfxmode=1024x768x32,1024x768x24,1024x768,800x600x32,800x600x24,800x600,auto
    set gfxpayload=keep
    terminal_output gfxterm
fi

# Load theme
set theme=/boot/grub/themes/stylish/theme.txt

# MiOS Boot Menu
echo "[BOOT] Welcome to GRUB!"
echo ""
echo ""

menuentry "Boot MiOS" --class mios {
    echo "[OK]  Loading MiOS kernel..."
    multiboot2 /boot/mios.elf
    module2 /boot/initrd.tar
    module2 /mios/boot.cfg
}

menuentry "About MiOS" --class about {
    echo "  MiOS Kernel v5.8"
    echo "  by Mikhail"
    echo "  https://mios-system.vercel.app"
    echo ""
    echo "  Press any key to continue..."
    sleep 5
    boot
}

menuentry "Reboot" --class reboot {
    reboot
}

menuentry "Shutdown" --class shutdown {
    halt
}

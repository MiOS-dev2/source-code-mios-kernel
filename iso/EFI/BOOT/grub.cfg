set timeout=5
set timeout_style=menu
set default=0

# UEFI video drivers
insmod efi_gop
insmod efi_uga
insmod png
insmod gfxterm
insmod gfxmenu
insmod font

set gfxmode=1024x768x32
set gfxpayload=keep
terminal_output gfxterm

background_image /boot/grub/background.png
set color_normal=light-gray/black
set color_highlight=white/blue

menuentry "MiOS" {
    multiboot2 /boot/kernel.bin
    module2 /boot/initrd.tar
    module2 /mios/boot.cfg
}
menuentry "MiOS (verbose)" {
    multiboot2 /boot/kernel.bin
    module2 /boot/initrd.tar
    module2 /mios/debug.cfg
}
menuentry "MiOS (console)" {
    multiboot2 /boot/kernel.bin
    module2 /boot/initrd.tar
    module2 /mios/console.cfg
}
